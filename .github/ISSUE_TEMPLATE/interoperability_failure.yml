name: Interoperability failure
description: Report a reproducible failure against a pinned SRT implementation
title: "[Interop] "
labels:
  - interoperability
body:
  - type: markdown
    attributes:
      value: |
        Retain report.json, JUnit, logs, and PCAPs privately. Do not paste passphrases, SSH details, or sensitive payloads into this issue.
  - type: input
    id: robotweax_revision
    attributes:
      label: Robotweax revision
    validations:
      required: true
  - type: input
    id: peer_revision
    attributes:
      label: Peer implementation and revision
      placeholder: Haivision SRT v1.5.7 / 899348d8318eb9a3c5a5b6ec43c4a1114288773a
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario name and seed
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Roles, direction, and socket options
      description: Exclude all secret values.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result
      description: Include the redacted error and references to retained evidence.
    validations:
      required: true
