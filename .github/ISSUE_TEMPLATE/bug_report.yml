name: Bug report
description: Report reproducible Robotweax SRT behavior that is not security-sensitive
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include credentials, passphrases, or sensitive PCAP payloads here. Follow SECURITY.md for security issues.
  - type: input
    id: revision
    attributes:
      label: Robotweax revision
      description: Commit hash or exact source revision.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Explain what should happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, socket options, seeds, and sanitized logs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Sanitizer output, statistics, or redacted artifact references.
