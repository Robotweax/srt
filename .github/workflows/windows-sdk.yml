name: Windows SDK installers
on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and test both installers (main only; requires release approval)'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/windows-sdk.yml'
      - 'tools/verify_release_tag.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          SIGN_REQUESTED: ${{ inputs.sign }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(robotweax_srt VERSION ([0-9.]+)').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid CMake project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the CMake project version exactly' }
          if ($env:SIGN_REQUESTED -eq 'true' -and $env:GITHUB_REF -cne 'refs/heads/main') { throw 'Manual signing requires main' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package validation regression tests
        shell: pwsh
        run: ./packaging/windows/test-package.ps1
      - name: SDK platform alias path tests
        shell: pwsh
        run: ./packaging/windows/test-platform-aliases.ps1
      - name: SDK upgrade preflight tests in the installed Windows PowerShell runtime
        shell: powershell
        run: ./packaging/windows/test-upgrade-check.ps1
      - name: Authenticode rejection regression tests
        shell: pwsh
        run: ./packaging/windows/test-signing.ps1
  build:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, bcrypt]
        platform: [Win32, x64, Arm64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.backend == 'openssl'
        with:
          repository: openssl/openssl
          ref: aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f
          path: openssl-source
          persist-credentials: false
      - name: Build dependency and SDK in target environment
        shell: pwsh
        env:
          SDK_PLATFORM: ${{ matrix.platform }}
          SDK_CONFIGURATION: ${{ matrix.configuration }}
          SDK_CRYPTO_BACKEND: ${{ matrix.backend }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $arch = @{Win32='x86'; x64='amd64'; Arm64='amd64_arm64'}[$env:SDK_PLATFORM]
          $script = Join-Path $PWD 'packaging\windows\build-ci.ps1'
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          & cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && `"$pwsh`" -NoProfile -File `"$script`" -Platform $env:SDK_PLATFORM -Configuration $env:SDK_CONFIGURATION -CryptoBackend $env:SDK_CRYPTO_BACKEND"
          if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-${{ matrix.backend }}-${{ matrix.configuration }}-${{ matrix.platform }}
          path: output/sdk-${{ matrix.configuration }}-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
  installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, bcrypt]
    env:
      SDK_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-${{ matrix.backend }}-*
          path: variants
      - name: Assemble and compile installer candidate
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 -Variants variants -Destination sdk -ArtifactPrefix "sdk-$env:SDK_BACKEND" -ExpectedBackend $env:SDK_BACKEND
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(robotweax_srt VERSION ([0-9.]+)').Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is required' }
          & $iscc "/DSdkRoot=$PWD\sdk" "/DProductVersion=$version" "/DCryptoBackend=$env:SDK_BACKEND" packaging/windows/sdk.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Smoke test silent install and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem packaging/windows/Output/*.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Robotweax SDK test'
          $variable = 'ROBOTWEAX_SRT_' + $env:SDK_BACKEND.ToUpperInvariant()
          $process = Start-Process -Wait -PassThru $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destination`""
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          if ([Environment]::GetEnvironmentVariable($variable,'Machine') -ne $destination) { throw 'SDK environment variable missing' }
          $before = (Get-FileHash "$destination/srt.props").Hash
          $process = Start-Process -Wait -PassThru $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destination`""
          if ($process.ExitCode -ne 0) { throw 'Same-version SDK repair failed' }
          $other = Join-Path $env:RUNNER_TEMP 'Robotweax SDK alternate'
          $process = Start-Process -Wait -PassThru $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$other`""
          if ($process.ExitCode -eq 0) { throw 'Parallel installation was not rejected' }
          if ((Get-FileHash "$destination/srt.props").Hash -ne $before) { throw 'Rejected installation changed existing SDK' }
          foreach ($config in 'Debug','Release') {
            foreach ($platform in 'Win32','x64','Arm64') {
              if (!(Test-Path "$destination/lib/$config-$platform/robotweax-srt.lib")) { throw 'Missing installed variant' }
            }
          }
          $process = Start-Process -Wait -PassThru "$destination/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if ($process.ExitCode -ne 0) { throw 'Uninstallation failed' }
          if (Test-Path "$destination/srt.props") { throw 'SDK files remained installed' }
          if ([Environment]::GetEnvironmentVariable($variable,'Machine') -eq $destination) { throw 'Stale SDK environment variable' }
          $process = Start-Process -Wait -PassThru $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$other`""
          if ($process.ExitCode -ne 0) { throw 'Reinstallation after uninstall failed' }
          if (!(Test-Path "$other/include/srt/srt.h")) { throw 'Reinstalled headers missing' }
          $process = Start-Process -Wait -PassThru "$other/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if ($process.ExitCode -ne 0) { throw 'Final cleanup failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-sdk-installer-${{ matrix.backend }}
          path: packaging/windows/Output/*.exe
          if-no-files-found: error
          retention-days: 7
  coexistence:
    needs: [validate, installer]
    outputs:
      installer-provenance: ${{ steps.provenance.outputs.json }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: windows-sdk-installer-*
          path: installers
          merge-multiple: true
      - name: Verify side-by-side installation and independent removal
        shell: pwsh
        run: ./packaging/windows/test-installers.ps1 -Installers installers
      - name: Record tested unsigned installer provenance
        id: provenance
        shell: pwsh
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          . ./packaging/windows/signing.ps1
          $record = Get-SdkInstallerProvenance installers $env:SDK_VERSION $env:GITHUB_SHA $env:GITHUB_RUN_ID
          "json=$($record | ConvertTo-Json -Compress -Depth 5)" >> $env:GITHUB_OUTPUT
  rebuild-qualification:
    # Exercise the exact rebuild recipe without approvals or signing authority.
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openssl/openssl
          ref: aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f
          path: openssl-source
          persist-credentials: false
      - name: Qualify independent rebuild without signing
        shell: pwsh
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: ./packaging/windows/rebuild-installers.ps1 -Revision $env:GITHUB_SHA -Version $env:SDK_VERSION -Destination "$PWD/rebuilt-installers" -WorkRoot "$env:RUNNER_TEMP/sdk-rebuild"
      - name: Test independently rebuilt installers
        shell: pwsh
        run: ./packaging/windows/test-installers.ps1 -Installers rebuilt-installers
  rebuild:
    # An ordinary producer's bytes must never become signing inputs. Rebuild
    # from the exact source on a fresh protected runner with no OIDC authority.
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main')
    needs: [validate, coexistence]
    runs-on: windows-latest
    timeout-minutes: 180
    environment: windows-release-signing
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      installer-provenance: ${{ steps.provenance.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openssl/openssl
          ref: aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f
          path: openssl-source
          persist-credentials: false
      - name: Rebuild both installers from the approved source
        shell: pwsh
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Rebuild requires a commit on main history' }
          ./packaging/windows/rebuild-installers.ps1 -Revision $env:GITHUB_SHA -Version $env:SDK_VERSION -Destination "$PWD/rebuilt-installers" -WorkRoot "$env:RUNNER_TEMP/sdk-rebuild"
      - name: Test the rebuilt unsigned pair
        shell: pwsh
        run: ./packaging/windows/test-installers.ps1 -Installers rebuilt-installers
      - name: Record independently rebuilt installer bytes
        id: provenance
        shell: pwsh
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          . ./packaging/windows/signing.ps1
          $record = Get-SdkInstallerProvenance rebuilt-installers $env:SDK_VERSION $env:GITHUB_SHA $env:GITHUB_RUN_ID
          "json=$($record | ConvertTo-Json -Compress -Depth 5)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: windows-sdk-rebuilt-installers
          path: rebuilt-installers/*.exe
          overwrite: false
          if-no-files-found: error
          retention-days: 7
  sign:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main')
    needs: [validate, rebuild]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: windows-release-signing
    concurrency:
      group: windows-release-signing
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ needs.validate.outputs.version }}
      INSTALLER_PROVENANCE: ${{ needs.rebuild.outputs.installer-provenance }}
      SIGNING_ACCOUNT_NAME: ${{ vars.SIGNING_ACCOUNT_NAME }}
      SIGNING_CERTIFICATE_PROFILE: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
      SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the independently rebuilt artifact identity
        shell: pwsh
        env:
          REBUILD_ARTIFACT_ID: ${{ needs.rebuild.outputs.artifact-id }}
        run: |
          if ($env:REBUILD_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'Missing rebuilt artifact ID' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.rebuild.outputs.artifact-id }}
          path: installers
          merge-multiple: true
      - name: Validate signing inputs and source ancestry
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID') {
            $value = [Environment]::GetEnvironmentVariable($name)
            $parsed = [guid]::Empty
            if (![guid]::TryParse($value, [ref]$parsed) -or $parsed -eq [guid]::Empty) { throw "Missing or invalid $name" }
          }
          if (!$env:SIGNING_ACCOUNT_NAME -or !$env:SIGNING_CERTIFICATE_PROFILE -or
              $env:SIGNING_ENDPOINT -notmatch '^https://[a-z]+\.codesigning\.azure\.net/?$') { throw 'Missing or invalid signing configuration' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Signing requires a commit on main history' }
          . ./packaging/windows/signing.ps1
          Assert-SdkInstallerProvenance installers $env:SDK_VERSION $env:GITHUB_SHA $env:GITHUB_RUN_ID $env:INSTALLER_PROVENANCE
          foreach ($file in @(Get-SdkInstallerPair installers $env:SDK_VERSION)) {
            if ([string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status -cne 'NotSigned') {
              throw 'Expected an unsigned installer candidate before signing'
            }
          }
      - name: Authenticate to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both final installer executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify signed pair and generate checksums after signing
        shell: pwsh
        run: ./packaging/windows/verify-signed-installers.ps1 -Installers installers -Version $env:SDK_VERSION -Publisher 'Robotweax GmbH' -WriteManifest
      - name: Install and test the exact signed executables
        shell: pwsh
        run: ./packaging/windows/test-installers.ps1 -Installers installers
      - name: Verify signed bytes remained unchanged after installation tests
        shell: pwsh
        run: ./packaging/windows/verify-signed-installers.ps1 -Installers installers -Version $env:SDK_VERSION -Publisher 'Robotweax GmbH' -RequireManifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-sdk-signed-installers
          path: |
            installers/*.exe
            installers/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  release-draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, sign]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-sdk-signed-installers
          path: installers
      - name: Reverify exact signed pair before release upload
        shell: pwsh
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: ./packaging/windows/verify-signed-installers.ps1 -Installers installers -Version $env:SDK_VERSION -Publisher 'Robotweax GmbH' -RequireManifest
      - name: Attach both installers to a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        working-directory: installers
        run: |
          set -euo pipefail
          openssl="robotweax-srt-${RELEASE_TAG#v}-windows-sdk-openssl.exe"
          bcrypt="robotweax-srt-${RELEASE_TAG#v}-windows-sdk-bcrypt.exe"
          test -s "$openssl"
          test -s "$bcrypt"
          sha256sum --check SHA256SUMS
          python ../tools/verify_release_tag.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" > tag-provenance.json
          tag_object="$(jq -r .object tag-provenance.json)"
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Refusing to modify a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Robotweax SRT ${RELEASE_TAG#v}" --notes 'Windows SDK installers: OpenSSL and BCrypt. Authenticode-signed by Robotweax GmbH with trusted timestamps; review qualification and release notes before publishing.'
          fi
          python ../tools/verify_release_tag.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --object "$tag_object" > tag-provenance.json
          gh release upload "$RELEASE_TAG" "$openssl" "$bcrypt" SHA256SUMS tag-provenance.json
