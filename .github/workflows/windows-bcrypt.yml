name: Experimental BCrypt backend
on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Run native ARM64 and serial x64 performance diagnostics only
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/crypto*'
      - 'include/robotweax/srt/crypto*'
      - 'tests/crypto_provider_comparison/**'
      - 'tests/crypto_provider_peer/**'
      - 'interop/run_encrypted_interop.py'
      - 'interop/run_aead_interop.py'
      - 'interop/run_encrypted_file_interop.py'
      - 'interop/srt_handshake_trace.py'
      - 'interop/tests/test_rendezvous_interop.py'
      - 'tests/test_crypto.cpp'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/windows-bcrypt.yml'
permissions:
  contents: read
jobs:
  arm64-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native ARM64 Release and Debug execution
        shell: pwsh
        run: |
          function Run([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed" }
          }
          New-Item -ItemType Directory evidence | Out-Null
          "runner=$env:RUNNER_ARCH; process=$([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture); sha=$env:GITHUB_SHA" | Set-Content evidence/architecture.txt
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'Native ARM64 runner required' }
          Run cmake @('-S','.', '-B','arm-build','-A','ARM64','-DROBOTWEAX_SRT_CRYPTO_BACKEND=bcrypt','-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON','-DENABLE_AEAD_API_PREVIEW=ON')
          Run cmake @('-S','tests/crypto_provider_comparison','-B','failures','-A','ARM64','-DCOMPARE_OPENSSL=OFF','-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON')
          foreach ($config in 'Release','Debug') {
            Run cmake @('--build','arm-build','--config',$config,'--parallel','2','--target','robotweax_srt_tests')
            Run "./arm-build/$config/robotweax_srt_tests.exe" @('provider')
            Run "./arm-build/$config/robotweax_srt_tests.exe" @('crypto')
            Run cmake @('--build','failures','--config',$config,'--parallel','2')
            Run ctest @('--test-dir','failures','-C',$config,'--output-on-failure')
            Copy-Item failures/Testing/Temporary/LastTest.log "evidence/failures-$config.log"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-arm64-crypto-evidence
          path: evidence/
          retention-days: 7
  serial-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: openssl/openssl
          ref: aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f
          path: openssl-source
          persist-credentials: false
      - name: Build pinned assembler-enabled OpenSSL and run serial measurements
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $script = Join-Path $PWD 'packaging/windows/measure-crypto.ps1'
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          & cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" amd64 && `"$pwsh`" -NoProfile -File `"$script`""
          if ($LASTEXITCODE -ne 0) { throw 'Qualification failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-crypto-performance-evidence
          path: evidence/
          retention-days: 7
  shared:
    if: github.event_name != 'workflow_dispatch' || !inputs.qualification
    name: Shared x64 (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        if: matrix.configuration == 'Release'
        with:
          repository: Haivision/srt
          ref: 899348d8318eb9a3c5a5b6ec43c4a1114288773a
          path: reference-source
          persist-credentials: false
      - name: Build isolated shared providers and installed consumers
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          function Run([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed" }
          }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(robotweax_srt VERSION ([0-9.]+)').Groups[1].Value
          foreach ($backend in 'bcrypt','openssl') {
            $prefix = "$PWD/installed-$backend"
            $options = @('-S','.', '-B',"shared-$backend",'-A','x64',"-DROBOTWEAX_SRT_CRYPTO_BACKEND=$backend",'-DBUILD_SHARED_LIBS=ON','-DROBOTWEAX_SRT_BUILD_TESTS=OFF','-DENABLE_AEAD_API_PREVIEW=ON')
            if ($backend -eq 'bcrypt') { $options += '-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON' }
            Run cmake $options
            Run cmake @('--build',"shared-$backend",'--config',$env:CONFIGURATION,'--parallel','2')
            Run cmake @('--install',"shared-$backend",'--config',$env:CONFIGURATION,'--prefix',$prefix)
            $consumerOptions = @('-S','tests/package_consumer','-B',"consumer-$backend",'-A','x64',"-DCMAKE_PREFIX_PATH=$prefix", "-DROBOTWEAX_SRT_PACKAGE_VERSION=$version",'-DROBOTWEAX_SRT_EXPECT_AEAD_API_PREVIEW=ON')
            if ($backend -eq 'bcrypt') { $consumerOptions += '-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON' }
            Run cmake $consumerOptions
            Run cmake @('--build',"consumer-$backend",'--config',$env:CONFIGURATION,'--parallel','2')
            Copy-Item "$prefix/bin/*.dll" "consumer-$backend/$env:CONFIGURATION/"
            Run ctest @('--test-dir',"consumer-$backend",'-C',$env:CONFIGURATION,'--output-on-failure')
            Run cmake @('-S','tests/crypto_provider_peer','-B',"peer-$backend",'-A','x64',"-DCMAKE_PREFIX_PATH=$prefix")
            Run cmake @('--build',"peer-$backend",'--config',$env:CONFIGURATION,'--parallel','2')
          }
      - name: BCrypt versus OpenSSL encrypted public API
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          python -c "import sys; assert sys.version_info >= (3, 10)"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.10+ required' }
          python interop/run_encrypted_interop.py --robotweax-peer "peer-bcrypt/$env:CONFIGURATION/crypto_peer.exe" --reference-peer "peer-openssl/$env:CONFIGURATION/crypto_peer.exe" --bytes 524288 --km-refresh-rate 64 --km-preannounce 20
          if ($LASTEXITCODE -ne 0) { throw 'CTR backend interoperability failed' }
          python interop/run_aead_interop.py --robotweax-peer "peer-bcrypt/$env:CONFIGURATION/crypto_peer.exe" --reference-peer "peer-openssl/$env:CONFIGURATION/crypto_peer.exe"
          if ($LASTEXITCODE -ne 0) { throw 'GCM backend interoperability failed' }
          python interop/run_encrypted_file_interop.py --profile base --reference-provider robotweax --robotweax-peer "peer-bcrypt/$env:CONFIGURATION/crypto_peer.exe" --reference-peer "peer-openssl/$env:CONFIGURATION/crypto_peer.exe" --bytes 524667 --km-refresh-rate 64 --km-preannounce 20
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted file backend interoperability failed' }
      - name: Build runner-local Haivision peer and test CTR
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          cmake -S tests/crypto_provider_peer -B peer-haivision -A x64 "-DHAIVISION_SOURCE=$PWD/reference-source"
          if ($LASTEXITCODE -ne 0) { throw 'Reference configure failed' }
          cmake --build peer-haivision --config Release --parallel 2 --target crypto_peer
          if ($LASTEXITCODE -ne 0) { throw 'Reference build failed' }
          python interop/run_encrypted_interop.py --robotweax-peer peer-bcrypt/Release/crypto_peer.exe --reference-peer peer-haivision/Release/crypto_peer.exe --bytes 524288 --km-refresh-rate 64 --km-preannounce 20
          if ($LASTEXITCODE -ne 0) { throw 'Haivision CTR interoperability failed' }
  native:
    if: github.event_name != 'workflow_dispatch' || !inputs.qualification
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure without OpenSSL discovery
        run: cmake -S . -B build -A ${{ matrix.arch }} -DROBOTWEAX_SRT_CRYPTO_BACKEND=bcrypt -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON -DENABLE_AEAD_API_PREVIEW=ON -DROBOTWEAX_SRT_BUILD_TOOLS=OFF -DROBOTWEAX_SRT_BUILD_BENCHMARKS=OFF
      - name: Build library and unit tests
        run: cmake --build build --config Release --parallel 2 --target robotweax_srt_tests
      - name: Provider vectors and crypto sessions
        if: matrix.arch != 'ARM64'
        shell: pwsh
        run: |
          & ./build/Release/robotweax_srt_tests.exe provider
          if ($LASTEXITCODE -ne 0) { throw 'Provider vectors failed' }
          & ./build/Release/robotweax_srt_tests.exe crypto
          if ($LASTEXITCODE -ne 0) { throw 'Crypto sessions failed' }
      - name: Differential comparison against OpenSSL
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cmake -S tests/crypto_provider_comparison -B compare -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Comparison configure failed' }
          cmake --build compare --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Comparison build failed' }
          ctest --test-dir compare -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Comparison failed' }
      - name: Installed package without OpenSSL discovery
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake --install build --config Release --prefix "$PWD/installed"
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(robotweax_srt VERSION ([0-9.]+)').Groups[1].Value
          cmake -S tests/package_consumer -B consumer -A $env:TARGET_ARCH "-DCMAKE_PREFIX_PATH=$PWD/installed" "-DROBOTWEAX_SRT_PACKAGE_VERSION=$version" -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON -DROBOTWEAX_SRT_EXPECT_AEAD_API_PREVIEW=ON
          if ($LASTEXITCODE -ne 0) { throw 'Consumer configure failed' }
          cmake --build consumer --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Consumer build failed' }
          if ($env:TARGET_ARCH -ne 'ARM64') {
            ctest --test-dir consumer -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Consumer execution failed' }
          }
