name: Package managers

on:
  pull_request:
    paths:
      - 'packaging/homebrew/**'
      - 'packaging/vcpkg/**'
      - 'packaging/tests/**'
      - 'tests/package_consumer/**'
      - '.github/workflows/package-managers.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packaging/homebrew/**'
      - 'packaging/vcpkg/**'
      - 'packaging/tests/**'
      - 'tests/package_consumer/**'
      - '.github/workflows/package-managers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Robotweax without Haivision
        run: |
          if brew list --formula srt >/dev/null 2>&1; then
            brew uninstall srt
          fi
          brew tap-new robotweax/validation
          cp packaging/homebrew/robotweax-srt.rb "$(brew --repository)/Library/Taps/robotweax/homebrew-validation/Formula/"
          brew install --build-from-source robotweax/validation/robotweax-srt
          brew install --only-dependencies --include-test robotweax/validation/robotweax-srt
      - name: Execute standalone consumers before installing Haivision
        run: |
          cmake -S packaging/tests -B package-standalone -DCMAKE_BUILD_TYPE=Release -DTEST_HAIVISION=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix robotweax-srt);$(brew --prefix openssl@3)"
          cmake --build package-standalone
          ctest --test-dir package-standalone --output-on-failure
          brew install srt
      - name: Audit and execute consumers
        run: |
          brew test robotweax/validation/robotweax-srt
          brew audit --strict robotweax/validation/robotweax-srt
          cmake -S packaging/tests -B package-consumers -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix robotweax-srt);$(brew --prefix openssl@3)" -DHAIVISION_PREFIX="$(brew --prefix srt)"
          cmake --build package-consumers --config Release
          ctest --test-dir package-consumers -C Release --output-on-failure
      - name: Remove Robotweax and retain Haivision
        run: |
          brew uninstall robotweax-srt
          ./package-consumers/haivision
          test "$(pkg-config --modversion srt)" != ''

  vcpkg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, triplet: x64-linux}
          - {os: ubuntu-24.04, triplet: x64-linux-dynamic}
          - os: windows-2022
            triplet: x64-windows-static
            msvc_runtime: 'MultiThreaded$<$<CONFIG:Debug>:Debug>'
          - {os: windows-2022, triplet: x64-windows}
          - {os: macos-15, triplet: arm64-osx}
          - {os: macos-15, triplet: arm64-osx-dynamic}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: dc1232a6e05dcc49703091e83743e3b4df9b9b7c
          path: .vcpkg
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Qualify standalone, coexistence, relocation and removal
        env:
          TRIPLET: ${{ matrix.triplet }}
          MSVC_RUNTIME: ${{ matrix.msvc_runtime }}
        run: python packaging/tests/qualify_vcpkg.py --vcpkg-root .vcpkg --work-root package-qualification
      - name: Retain qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-qualification-${{ matrix.triplet }}
          path: |
            package-qualification/*/Testing/Temporary/*.log
            package-qualification/*/CMakeCache.txt
            .vcpkg/buildtrees/robotweax-srt/*.log
          if-no-files-found: ignore
