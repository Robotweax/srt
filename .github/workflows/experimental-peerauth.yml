name: Experimental peer authentication

on:
  push:
    branches: [main, dev/peer-authentication]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'interop/run_peer_authentication_compat.py'
      - 'CMakeLists.txt'
      - '.github/workflows/experimental-peerauth.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'interop/run_peer_authentication_compat.py'
      - 'CMakeLists.txt'
      - '.github/workflows/experimental-peerauth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peerauth-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Peer authentication (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [default-off, enabled]
        include:
          - os: ubuntu-latest
            profile: sanitized
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config clang
          else
            brew install openssl@3 pkg-config
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
      - name: Configure
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          extra=()
          if [[ "$PROFILE" != default-off ]]; then
            extra+=(-DROBOTWEAX_SRT_ENABLE_EXPERIMENTAL_PEERAUTH=ON -DENABLE_AEAD_API_PREVIEW=ON)
          fi
          if [[ "$PROFILE" == sanitized ]]; then
            extra+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug             -DROBOTWEAX_SRT_BUILD_TESTS=ON -DROBOTWEAX_SRT_BUILD_TOOLS=OFF             -DROBOTWEAX_SRT_BUILD_BENCHMARKS=OFF "${extra[@]}"
      - name: Build
        run: cmake --build build --target robotweax_srt_tests --parallel 4
      - name: Authentication and transport regressions
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          mkdir -p evidence
          for suite in peer_auth socket_options handshake connect listener_admission runtime_work_executor socket_readiness; do
            build/robotweax_srt_tests "$suite" 2>&1 | tee "evidence/$suite.log"
          done
          python3 tests/package_consumer/check_documentation.py .
      - name: Fixed-input legacy wire compatibility
        if: matrix.profile != 'sanitized'
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/peer_authentication_peer -B peer \
            -DCMAKE_PREFIX_PATH="$PWD/stage" -DROBOTWEAX_NATIVE_SOURCE="$PWD"
          cmake --build peer --parallel 4
          peer/peer_authentication_wire > evidence/legacy-wire.txt
          python3 -c 'import hashlib,pathlib; expected=pathlib.Path("tests/peer_authentication_peer/legacy-wire.sha256").read_text().split()[0]; actual=hashlib.sha256(pathlib.Path("evidence/legacy-wire.txt").read_bytes()).hexdigest(); assert actual == expected, (actual, expected)'
      - name: Pinned reference for black-box compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'enabled'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Haivision/srt
          ref: 899348d8318eb9a3c5a5b6ec43c4a1114288773a
          path: reference-source
          persist-credentials: false
      - name: Legacy success and REQUIRED rejection in both roles
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'enabled'
        shell: bash
        run: |
          cmake -S tests/peer_authentication_peer -B reference-peer \
            -DHAIVISION_SOURCE="$PWD/reference-source"
          cmake --build reference-peer --target peer_authentication_peer --parallel 4
          python3 interop/run_peer_authentication_compat.py \
            --enabled-peer peer/peer_authentication_peer \
            --legacy-peer reference-peer/peer_authentication_peer \
            --legacy-revision 899348d8318eb9a3c5a5b6ec43c4a1114288773a \
            --output evidence/reference-compatibility.json
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerauth-${{ matrix.os }}-${{ matrix.profile }}
          path: evidence/
          if-no-files-found: ignore

  shared-api:
    name: Installed shared C API (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          else
            brew install openssl@3 pkg-config
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
      - name: Build and inspect enabled and disabled shared packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          for mode in ON OFF; do
            cmake -S . -B "shared-$mode" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DENABLE_AEAD_API_PREVIEW=ON "-DROBOTWEAX_SRT_ENABLE_EXPERIMENTAL_PEERAUTH=$mode" -DROBOTWEAX_SRT_BUILD_TESTS=OFF -DROBOTWEAX_SRT_BUILD_TOOLS=OFF -DROBOTWEAX_SRT_BUILD_BENCHMARKS=OFF
            cmake --build "shared-$mode" --parallel 4
            cmake --install "shared-$mode" --prefix "$PWD/shared-$mode-stage"
            cmake -S tests/peer_authentication_peer -B "shared-$mode-peer" "-DCMAKE_PREFIX_PATH=$PWD/shared-$mode-stage"
            cmake --build "shared-$mode-peer" --parallel 4
            python3 tests/verify_shared_library_exports.py --library "$PWD/shared-$mode-stage/lib/librobotweax-srt.$suffix" --manifest cmake/public-symbols.txt --header include/robotweax_srt.h --header include/srt/srt.h --tool nm | tee "evidence/shared-$mode-exports.log"
          done
      - name: Installed C API authentication and feature-off gating
        shell: bash
        run: |
          set -o pipefail
          shared-OFF-peer/peer_authentication_peer caller 0 unavailable | tee evidence/options-unavailable.log
          python3 interop/run_peer_authentication_compat.py --enabled-peer shared-ON-peer/peer_authentication_peer --legacy-peer shared-OFF-peer/peer_authentication_peer --legacy-session-auth --legacy-revision "feature-disabled-shared-$GITHUB_SHA" --output evidence/shared-compatibility.json
      - name: Preserve shared-package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerauth-shared-${{ matrix.os }}
          path: evidence/
          if-no-files-found: ignore

  fuzz:
    name: Seeded peer-authentication fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev pkg-config
      - name: Build instrumented parser and transcript target
        run: |
          cmake -S . -B fuzz-build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DROBOTWEAX_SRT_ENABLE_EXPERIMENTAL_PEERAUTH=ON -DENABLE_AEAD_API_PREVIEW=ON -DROBOTWEAX_SRT_BUILD_FUZZERS=ON -DROBOTWEAX_SRT_BUILD_TESTS=OFF -DROBOTWEAX_SRT_BUILD_TOOLS=OFF -DROBOTWEAX_SRT_BUILD_BENCHMARKS=OFF
          cmake --build fuzz-build --target fuzz_peer_authentication --parallel 4
      - name: Exercise valid records, transcripts, opaque extensions and curve inputs
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          mkdir -p evidence/fuzz
          python3 fuzz/peer_authentication_corpus.py evidence/corpus
          fuzz-build/fuzz_peer_authentication evidence/corpus -runs=50000 -seed=385 -max_len=4500 -timeout=5 -rss_limit_mb=1024 "-artifact_prefix=$PWD/evidence/fuzz/" 2>&1 | tee evidence/fuzz.log
      - name: Preserve fuzz evidence and reproductions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerauth-fuzz
          path: evidence/
          if-no-files-found: ignore
