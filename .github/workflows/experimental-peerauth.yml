name: Experimental peer authentication

on:
  push:
    branches: [main, dev/peer-authentication]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'interop/run_peer_authentication_compat.py'
      - 'CMakeLists.txt'
      - '.github/workflows/experimental-peerauth.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'interop/run_peer_authentication_compat.py'
      - 'CMakeLists.txt'
      - '.github/workflows/experimental-peerauth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peerauth-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Peer authentication (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [default-off, enabled]
        include:
          - os: ubuntu-latest
            profile: sanitized
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config clang
          else
            brew install openssl@3 pkg-config
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
      - name: Configure
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          extra=()
          if [[ "$PROFILE" != default-off ]]; then
            extra+=(-DROBOTWEAX_SRT_ENABLE_EXPERIMENTAL_PEERAUTH=ON -DENABLE_AEAD_API_PREVIEW=ON)
          fi
          if [[ "$PROFILE" == sanitized ]]; then
            extra+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug             -DROBOTWEAX_SRT_BUILD_TESTS=ON -DROBOTWEAX_SRT_BUILD_TOOLS=OFF             -DROBOTWEAX_SRT_BUILD_BENCHMARKS=OFF "${extra[@]}"
      - name: Build
        run: cmake --build build --target robotweax_srt_tests --parallel 4
      - name: Authentication and transport regressions
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          mkdir -p evidence
          for suite in peer_auth socket_options handshake connect listener_admission runtime_work_executor; do
            build/robotweax_srt_tests "$suite" 2>&1 | tee "evidence/$suite.log"
          done
          python3 tests/package_consumer/check_documentation.py .
      - name: Fixed-input legacy wire compatibility
        if: matrix.profile != 'sanitized'
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/peer_authentication_peer -B peer \
            -DCMAKE_PREFIX_PATH="$PWD/stage" -DROBOTWEAX_NATIVE_SOURCE="$PWD"
          cmake --build peer --parallel 4
          peer/peer_authentication_wire > evidence/legacy-wire.txt
          python3 -c 'import hashlib,pathlib; expected=pathlib.Path("tests/peer_authentication_peer/legacy-wire.sha256").read_text().split()[0]; actual=hashlib.sha256(pathlib.Path("evidence/legacy-wire.txt").read_bytes()).hexdigest(); assert actual == expected, (actual, expected)'
      - name: Pinned reference for black-box compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'enabled'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Haivision/srt
          ref: 899348d8318eb9a3c5a5b6ec43c4a1114288773a
          path: reference-source
          persist-credentials: false
      - name: Legacy success and REQUIRED rejection in both roles
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'enabled'
        shell: bash
        run: |
          cmake -S tests/peer_authentication_peer -B reference-peer \
            -DHAIVISION_SOURCE="$PWD/reference-source"
          cmake --build reference-peer --target peer_authentication_peer --parallel 4
          python3 interop/run_peer_authentication_compat.py \
            --enabled-peer peer/peer_authentication_peer \
            --legacy-peer reference-peer/peer_authentication_peer \
            --legacy-revision 899348d8318eb9a3c5a5b6ec43c4a1114288773a \
            --output evidence/reference-compatibility.json
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerauth-${{ matrix.os }}-${{ matrix.profile }}
          path: evidence/
          if-no-files-found: ignore
