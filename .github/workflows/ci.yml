        if: matrix.profile == 'aead-timing'
        run: >-
          python3 interop/run_aead_timing_interop.py
          --timing-peer build-aead/robotweax_srt_timing_peer
          --sender-peer build-aead/robotweax_srt_interop_peer
          --group-sender-peer build-aead/robotweax_srt_group_timing_sender
          --failure-artifacts "${{ runner.temp }}/aead-timing-failures"
      - name: Preserve AES-GCM timing failure diagnostics
        if: >-
          failure() && matrix.profile == 'aead-timing'
          && steps.aead_timing.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: aead-timing-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aead-timing-failures/run-*/*.json
            ${{ runner.temp }}/aead-timing-failures/run-*/*.log
          retention-days: 3
          if-no-files-found: warn
      - name: Run Haivision v1.5.6 encrypted security baseline
