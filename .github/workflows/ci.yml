      - name: Run pinned AES-GCM IPv6 File/Stream preview matrix
        if: matrix.profile == 'aead-file-ipv6'
        run: >-
          python3 interop/run_aead_file_interop.py
          --robotweax-peer build-aead/robotweax_srt_interop_peer
          --reference-peer ./reference-aead-api-peer
          --host ::1
      - name: Run pinned AES-GCM FEC matrix
        if: matrix.profile == 'aead-fec'
        run: >-
