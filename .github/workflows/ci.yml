          --reference-peer ./reference-scalability-peer
          --profile robotweax-self
          --profile haivision-self
          --connections 1,4
          --message-sizes 188,1316
          --bytes-per-connection 131600
          --warmup 0
          --iterations 1
          --timeout-seconds 15
          --output build/many-socket-reference-smoke.json

  reference_interop:
    name: Reference interoperability
    if: >-
      always()
      && (needs.changes.outputs.interop == 'true'
      || needs.changes.outputs.benchmark == 'true')
    needs:
      - changes
      - reference_interop_prepare
      - reference_interop_shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require preparation and every selected shard to pass
        shell: bash
        env:
          PREPARE: ${{ needs.reference_interop_prepare.result }}
          SHARDS: ${{ needs.reference_interop_shard.result }}
        run: |
          set -euo pipefail
          printf '%-24s %s\n' "prepare" "$PREPARE" "shards" "$SHARDS"
          [[ "$PREPARE" == "success" && "$SHARDS" == "success" ]]

  ci_gate:
    name: Required CI gate
    if: always()
    # Keep every check represented here and in the result loop below.
    # Preparation/shards are checked strictly by reference_interop.
    # interop/tests/test_ci_gate.py guards this coverage and shell behavior.
    needs:
      - changes
      - dco
      - documentation
      - python_tests
      - format_check
      - linux_release
      - live_timing
      - portable_release
      - debug_matrix
      - shared_library
      - ffmpeg_integration
      - aead_platform
      - sanitizers
      - thread_sanitizer
      - fuzz_smoke
      - reference_interop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A successful run plus this successful step proves full selection.
      # A deduplicated schedule has full=false and cannot renew the evidence.
      - name: Full validation selected (v1)
        if: needs.changes.outputs.full == 'true'
        run: ':'
      - name: Require every selected job to pass
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          DCO: ${{ needs.dco.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          PYTHON_TESTS: ${{ needs.python_tests.result }}
          FORMAT_CHECK: ${{ needs.format_check.result }}
          LINUX_RELEASE: ${{ needs.linux_release.result }}
          LIVE_TIMING: ${{ needs.live_timing.result }}
          PORTABLE_RELEASE: ${{ needs.portable_release.result }}
          DEBUG_MATRIX: ${{ needs.debug_matrix.result }}
          SHARED_LIBRARY: ${{ needs.shared_library.result }}
          FFMPEG_INTEGRATION: ${{ needs.ffmpeg_integration.result }}
          AEAD_PLATFORM: ${{ needs.aead_platform.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          THREAD_SANITIZER: ${{ needs.thread_sanitizer.result }}
          FUZZ_SMOKE: ${{ needs.fuzz_smoke.result }}
          REFERENCE_INTEROP: ${{ needs.reference_interop.result }}
          EXPECT_changes: 'true'
          EXPECT_dco: 'true'
          EXPECT_documentation: ${{ needs.changes.outputs.documentation == 'true' }}
          EXPECT_python_tests: ${{ needs.changes.outputs.python == 'true' }}
          EXPECT_format_check: ${{ needs.changes.outputs.format == 'true' }}
          EXPECT_linux_release: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.package == 'true' }}
          EXPECT_live_timing: ${{ needs.changes.outputs.timing == 'true' && needs.changes.outputs.core_tests != 'true' }}
          EXPECT_portable_release: ${{ needs.changes.outputs.portable == 'true' }}
          EXPECT_debug_matrix: ${{ needs.changes.outputs.debug == 'true' }}
          EXPECT_shared_library: ${{ needs.changes.outputs.shared == 'true' }}
          EXPECT_ffmpeg_integration: ${{ needs.changes.outputs.ffmpeg == 'true' }}
          EXPECT_aead_platform: ${{ needs.changes.outputs.aead_platform == 'true' || needs.changes.outputs.examples == 'true' }}
          EXPECT_sanitizers: ${{ needs.changes.outputs.sanitizers == 'true' }}
          EXPECT_thread_sanitizer: ${{ needs.changes.outputs.thread_sanitizer == 'true' }}
          EXPECT_fuzz_smoke: ${{ needs.changes.outputs.fuzz == 'true' }}
          EXPECT_reference_interop: ${{ needs.changes.outputs.interop == 'true' || needs.changes.outputs.benchmark == 'true' }}
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "changes=$CHANGES" \
            "dco=$DCO" \
            "documentation=$DOCUMENTATION" \
            "python-tests=$PYTHON_TESTS" \
            "format-check=$FORMAT_CHECK" \
            "linux-release=$LINUX_RELEASE" \
            "live-timing=$LIVE_TIMING" \
            "portable-release=$PORTABLE_RELEASE" \
            "debug-matrix=$DEBUG_MATRIX" \
            "shared-library=$SHARED_LIBRARY" \
            "ffmpeg-integration=$FFMPEG_INTEGRATION" \
            "aead-platform=$AEAD_PLATFORM" \
            "sanitizers=$SANITIZERS" \
            "thread-sanitizer=$THREAD_SANITIZER" \
            "fuzz-smoke=$FUZZ_SMOKE" \
            "reference-interop=$REFERENCE_INTEROP"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            printf '%-24s %s\n' "$name" "$result"
            case "$result" in
              success) ;;
              skipped)
                expected="EXPECT_${name//-/_}"
                if [[ "${!expected}" != "false" ]]; then
                  echo "Required job was unexpectedly skipped: $name" >&2
                  failed=1
                fi
                ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
