      - name: Run pinned AES-GCM IPv4 preview matrix
        if: matrix.profile == 'aead'
        run: >-
          python3 interop/run_aead_interop.py
          --robotweax-peer build-aead/robotweax_srt_interop_peer
          --reference-peer ./reference-aead-api-peer
      - name: Run pinned AES-GCM IPv6 preview matrix
        if: matrix.profile == 'aead-ipv6'
        run: >-
