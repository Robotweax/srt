          -Ireference-srt/srtcore -Ireference-build
          reference-build/libsrt.a -lcrypto -lpthread -ldl
          -o reference-binding-peer
      - name: Build Haivision v1.5.6 security-profile peer locally
        if: matrix.profile == 'encrypted'
