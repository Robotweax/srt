      - name: Build Haivision v1.5.5 backward-profile peer locally
        if: matrix.profile == 'encrypted'
        run: >-
          c++ -std=c++17 -O2
          -DROBOTWEAX_SRT_REFERENCE_DIAGNOSTICS=1
          interop/api_peer.cpp
          -Ireference-legacy-srt/srtcore -Ireference-legacy-build
          reference-legacy-build/libsrt.a -lcrypto -lpthread -ldl
          -o reference-legacy-api-peer
      - name: Build pinned Haivision AEAD-preview peer locally
        if: >-
          matrix.profile == 'aead'
          || matrix.profile == 'aead-ipv6'
          || matrix.profile == 'aead-file'
          || matrix.profile == 'aead-file-ipv6'
          || matrix.profile == 'aead-fec'
        run: >-
          c++ -std=c++17 -O2
          -DENABLE_AEAD_API_PREVIEW=1
          -DROBOTWEAX_SRT_REFERENCE_DIAGNOSTICS=1
          interop/api_peer.cpp
          -Ireference-aead-srt/srtcore -Ireference-aead-build
          reference-aead-build/libsrt.a -lcrypto -lpthread -ldl
          -o reference-aead-api-peer
      - name: Build reference connection-group peer locally
        if: matrix.profile == 'handshake'
        run: >-
          c++ -std=c++17 -O2 interop/group_peer.cpp
          -Ireference-srt/srtcore -Ireference-build
          reference-build/libsrt.a -lcrypto -lpthread -ldl
          -o reference-group-peer
      - name: Run bidirectional HSv5 interoperability test
        if: matrix.profile == 'handshake'
        run: >-
          python3 interop/run_handshake_interop.py
          --robotweax-probe build/robotweax_srt_handshake_probe
