        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-legacy-srt reference-legacy-build
          git clone https://github.com/Haivision/srt.git reference-legacy-srt
          git -C reference-legacy-srt checkout "$REFERENCE_SRT_LEGACY_COMMIT"
      - name: Build Haivision SRT v1.5.5 backward profile locally
        if: >-
