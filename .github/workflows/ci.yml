          c++ -std=c++17 -O2
          -DROBOTWEAX_SRT_REFERENCE_DIAGNOSTICS=1
          interop/api_peer.cpp
          -Ireference-security-srt/srtcore -Ireference-security-build
          reference-security-build/libsrt.a -lcrypto -lpthread -ldl
