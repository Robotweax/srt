          --reference-peer ./reference-peer
      - name: Run receiver TLPKTDROP and fake-ACK matrix
        if: matrix.profile == 'handshake'
        run: >-
          python3 interop/run_tlpktdrop_interop.py
          --robotweax-peer build/robotweax_srt_interop_peer
