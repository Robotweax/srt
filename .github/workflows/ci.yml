        run: >-
          cmake -S reference-legacy-srt -B reference-legacy-build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_ENCRYPTION=ON
          -DENABLE_BONDING=ON
          -DENABLE_APPS=ON
          -DENABLE_TESTING=OFF
          && cmake --build reference-legacy-build --parallel
          --target srt-live-transmit
      - name: Save Haivision v1.5.5 backward build from shard
        if: >-
          matrix.profile == 'encrypted'
          && steps.reference_legacy_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            reference-legacy-srt
            reference-legacy-build
          key: ${{ steps.reference_toolchain.outputs.legacy_cache_key }}
      - name: Restore Haivision v1.5.6 security build locally
        if: matrix.profile == 'encrypted'
        id: reference_security_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            reference-security-srt
            reference-security-build
          key: ${{ steps.reference_toolchain.outputs.security_cache_key }}
      - name: Fetch Haivision SRT v1.5.6 security profile locally
        if: >-
          matrix.profile == 'encrypted'
          && steps.reference_security_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-security-srt reference-security-build
          git clone https://github.com/Haivision/srt.git reference-security-srt
          git -C reference-security-srt checkout "$REFERENCE_SRT_SECURITY_COMMIT"
      - name: Build Haivision SRT v1.5.6 security profile locally
        if: >-
          matrix.profile == 'encrypted'
          && steps.reference_security_cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S reference-security-srt -B reference-security-build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_ENCRYPTION=ON
          -DENABLE_BONDING=ON
          -DENABLE_APPS=ON
          -DENABLE_TESTING=OFF
          && cmake --build reference-security-build --parallel
          --target srt-live-transmit
      - name: Save Haivision v1.5.6 security build from shard
        if: >-
          matrix.profile == 'encrypted'
          && steps.reference_security_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            reference-security-srt
            reference-security-build
          key: ${{ steps.reference_toolchain.outputs.security_cache_key }}
      - name: Restore pinned Haivision AEAD-preview build locally
        if: >-
          matrix.profile == 'aead'
          || matrix.profile == 'aead-ipv6'
          || matrix.profile == 'aead-file'
          || matrix.profile == 'aead-file-ipv6'
          || matrix.profile == 'aead-fec'
        id: reference_aead_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            reference-aead-srt
            reference-aead-build
          key: ${{ steps.reference_toolchain.outputs.aead_cache_key }}
      - name: Fetch pinned Haivision AEAD-preview revision locally
        if: >-
          (matrix.profile == 'aead'
          || matrix.profile == 'aead-ipv6'
          || matrix.profile == 'aead-file'
          || matrix.profile == 'aead-file-ipv6'
          || matrix.profile == 'aead-fec')
          && steps.reference_aead_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-aead-srt reference-aead-build
          git clone https://github.com/Haivision/srt.git reference-aead-srt
          git -C reference-aead-srt checkout "$REFERENCE_SRT_AEAD_COMMIT"
      - name: Build pinned Haivision AEAD preview locally
        if: >-
          (matrix.profile == 'aead'
          || matrix.profile == 'aead-ipv6'
          || matrix.profile == 'aead-file'
          || matrix.profile == 'aead-file-ipv6'
          || matrix.profile == 'aead-fec')
          && steps.reference_aead_cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S reference-aead-srt -B reference-aead-build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_ENCRYPTION=ON
          -DENABLE_AEAD_API_PREVIEW=ON
          -DUSE_ENCLIB=openssl-evp
          -DENABLE_APPS=OFF
          -DENABLE_TESTING=OFF
          && cmake --build reference-aead-build --parallel
      - name: Save pinned Haivision AEAD-preview build from shard
        if: >-
          (matrix.profile == 'aead'
          || matrix.profile == 'aead-ipv6'
          || matrix.profile == 'aead-file'
          || matrix.profile == 'aead-file-ipv6'
          || matrix.profile == 'aead-fec')
          && steps.reference_aead_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            reference-aead-srt
            reference-aead-build
          key: ${{ steps.reference_toolchain.outputs.aead_cache_key }}
      - name: Download Robotweax interoperability tools
        uses: actions/download-artifact@v8
        with:
          name: robotweax-interop-tools
          path: ${{ runner.temp }}/robotweax-interop-tools
      - name: Extract Robotweax interoperability tools
        run: >-
          tar --extract --gzip
          --file "$RUNNER_TEMP/robotweax-interop-tools/robotweax-interop-tools.tar.gz"
      - name: Build exact-message reference helper locally
        if: matrix.profile == 'handshake'
        run: >-
          c++ -std=c++17 interop/reference_peer.cpp
          -Ireference-srt/srtcore -Ireference-build
          reference-build/libsrt.a -lcrypto -lpthread -ldl
          -o reference-peer
      - name: Build reference API peer locally
        if: >-
          matrix.profile == 'handshake'
          || matrix.profile == 'encrypted'
