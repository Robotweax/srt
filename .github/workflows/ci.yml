          --reference-peer ./reference-api-peer
      - name: Run encrypted key-rotation interoperability matrix
        if: matrix.profile == 'encrypted'
        run: >-
          python3 interop/run_encrypted_interop.py
          --robotweax-peer build/robotweax_srt_interop_peer
