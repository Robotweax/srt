name: Linux packages

on:
  pull_request:
    paths:
      - 'packaging/debian/**'
      - 'packaging/fedora/**'
      - 'packaging/linux/**'
      - 'packaging/tests/**'
      - 'tests/package_consumer/**'
      - '.github/workflows/linux-packages.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packaging/debian/**'
      - 'packaging/fedora/**'
      - 'packaging/linux/**'
      - 'packaging/tests/**'
      - 'tests/package_consumer/**'
      - '.github/workflows/linux-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu-26.04, image: 'ubuntu:26.04', script: qualify-ubuntu.sh}
          - {name: fedora-44, image: 'fedora:44', script: qualify-fedora.sh}
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify immutable 0.3.3 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output "$RUNNER_TEMP/source.tar.gz" \
            https://github.com/Robotweax/srt/archive/4a1e49166bd761d7f065bc5a4b9c924ca73333ea.tar.gz
          echo "6769aaeffdc0cb8826c365a12e185ddd82e6af5c3d856e4de8236e980b3bcf3b  $RUNNER_TEMP/source.tar.gz" |
            sha256sum --check -
      - name: Build, install, test coexistence and removal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-output"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/source.tar.gz:/source.tar.gz:ro" \
            -v "$RUNNER_TEMP/package-output:/out" \
            "${{ matrix.image }}" bash "/work/packaging/linux/${{ matrix.script }}"
      - name: Retain packages for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.name }}
          path: ${{ runner.temp }}/package-output/*
          if-no-files-found: ignore
